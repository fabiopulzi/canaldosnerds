name: Atualizar vídeos do canal

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch:          # permite rodar à mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar vídeos recentes
        run: python3 scripts/atualizar_videos.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- videos.json; then
            echo "Nenhum vídeo novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualiza lista de vídeos do canal"
          git push
